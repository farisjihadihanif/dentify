[project]
name = "denthub-ai-service"
version = "1.0.0"
description = "DentHub AI Service - Custom Keras Computer Vision Inference & Deni LangChain Agent"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
