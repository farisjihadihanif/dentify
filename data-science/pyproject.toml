[project]
name = "denthub-data-science"
version = "1.0.0"
description = "DentHub Data Wrangling, EDA, Feature Engineering, A/B Testing & Streamlit Dashboard"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
