  <path d="M36 92 C38 116 56 124 72 122" fill="none" stroke="#0E7490" stroke-width="5" stroke-linecap="round"/>
  <circle cx="76" cy="122" r="6" fill="#0F766E"/>
  <!-- eyes -->
  <ellipse cx="82" cy="84" rx="7" ry="9" fill="#0B192C"/>
  <ellipse cx="118" cy="84" rx="7" ry="9" fill="#0B192C"/>
  <circle cx="84.5" cy="80.5" r="2.5" fill="#FFFFFF"/>
  <circle cx="120.5" cy="80.5" r="2.5" fill="#FFFFFF"/>
  <!-- cheeks -->
  <ellipse cx="70" cy="100" rx="8" ry="5" fill="#FDA4AF" opacity="0.6"/>
  <ellipse cx="130" cy="100" rx="8" ry="5" fill="#FDA4AF" opacity="0.6"/>
  <!-- smile -->
  <path d="M88 102 Q100 116 112 102" fill="none" stroke="#0B192C" stroke-width="4" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M168 30 L171 39 L180 42 L171 45 L168 54 L165 45 L156 42 L165 39 Z" fill="#14B8A6"/>
