name: dentify
description: "Dentify: skrining awal kesehatan gigi (Android)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_map: ^8.3.2
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.5.0
  geolocator: ^14.1.2
  google_fonts: ^9.0.0
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    # Font dibundel; unduhan saat runtime dimatikan di fonts.dart.
    - assets/google_fonts/
