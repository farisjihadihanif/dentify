# Render Blueprint for Dentify: backend (Express) + ai-service (FastAPI, TFLite) on the Free plan.
# The frontend is deployed on Vercel (see DEPLOY.md). No secret or deployment URL is written here:
# `sync: false` values are entered in the Render Dashboard when the Blueprint is created, and
# `generateValue` secrets are generated by Render.
#
# Free plan notes: each service sleeps after 15 minutes without inbound traffic and takes about a
# minute to wake up (the frontend shows a "server sedang dinyalakan" state meanwhile). The local
# disk is wiped on every restart; nothing here relies on it (scan photos are never stored).

services:
  - type: web
    name: dentify-ai-service
    runtime: python
    plan: free
    region: singapore
    rootDir: ai-service
    # Serving requirements only (LiteRT, no TensorFlow): peak ~185 MB, fits the 512 MB instance.
    # The model is not in git; fetch_model.py downloads it from MODEL_URL during the build.
    buildCommand: pip install -r requirements.txt && python scripts/fetch_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness only: no model call, no internal key
    healthCheckPath: /healthz
    envVars:
      # ai-edge-litert has no wheel for Render's default Python 3.14
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MODEL_RUNTIME
        value: tflite
      - key: CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: EMERGENCY_CONFIDENCE
        value: "0.85"
      - key: LLM_TIMEOUT_S
        value: "20"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Shared with the backend through fromService below
      - key: AI_SERVICE_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_URL
        sync: false
      - key: MODEL_SHA256
        sync: false

  - type: web
    name: dentify-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # NODE_ENV=production makes a plain `npm install` skip devDependencies (typescript), so the
    # build would fail; --include=dev keeps them for `tsc`.
    buildCommand: npm ci --include=dev --no-fund --no-audit && npm run build
    startCommand: npm start
    # /healthz does not touch MongoDB or the ai-service, so probes never keep the ai-service awake
    # (both services share the workspace's 750 free instance hours per month).
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      # Long enough for the ai-service to wake from sleep (~1 minute) on the first scan
      - key: AI_SERVICE_TIMEOUT_MS
        value: "75000"
      - key: OVERPASS_URL
        value: https://overpass-api.de/api/interpreter
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org/search
      - key: OSM_USER_AGENT
        value: Dentify/1.0 (capstone-cc26-psu285@dentify.local)
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_API_KEY
        fromService:
          type: web
          name: dentify-ai-service
          envVarKey: AI_SERVICE_API_KEY
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_SERVICE_URL
        sync: false
