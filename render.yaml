# Render Blueprint for Dentify: the ai-service (FastAPI, TFLite) on the Free plan. The backend and
# the frontend are deployed on Vercel (see DEPLOY.md). No secret or deployment URL is written here:
# `sync: false` values are entered in the Render Dashboard when the Blueprint is created, and
# `generateValue` secrets are generated by Render.
#
# Free plan notes: the service sleeps after 15 minutes without inbound traffic and takes about a
# minute to wake up. cron-job.org pings /healthz every 10 minutes to keep it awake; that fits the
# 750 free hours only while this is the only Render service. The local disk is wiped on restart.

services:
  - type: web
    name: dentify-ai-service
    runtime: python
    plan: free
    region: singapore
    rootDir: ai-service
    # Serving requirements only (LiteRT, no TensorFlow): peak ~185 MB, fits the 512 MB instance.
    # The model is not in git; fetch_model.py downloads it from MODEL_URL during the build.
    buildCommand: pip install -r requirements.txt && python scripts/fetch_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness only: no model call, no internal key
    healthCheckPath: /healthz
    envVars:
      # ai-edge-litert has no wheel for Render's default Python 3.14
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MODEL_RUNTIME
        value: tflite
      - key: CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: EMERGENCY_CONFIDENCE
        value: "0.85"
      - key: LLM_TIMEOUT_S
        value: "20"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Copy the generated value to AI_SERVICE_API_KEY of the backend project on Vercel
      - key: AI_SERVICE_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_URL
        sync: false
      - key: MODEL_SHA256
        sync: false
